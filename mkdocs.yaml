# $schema: https://squidfunk.github.io/mkdocs-material/schema.json

site_name: gh-maintainer
site_description: Keep good projects moving. A local maintenance queue for your GitHub repositories.
extra_css:
    - stylesheets/extra.css
nav:
    - Home 🏠: index.md
    - Usage and deployment: usage.md
    - CLI workflows: cli.md
    - Configuration files: configuration.md
    - Installation and releases: releases.md
    - Repository policy: policy.md
    - Technical context: context.md
    - Local triage skill: skills.md
    - Triage evaluation: evaluations/local-triage.md
    - Release validation: evaluations/release.md
    - Project context: project-context.md
    - Design decisions: decisions.md
    - Scope and roadmap: roadmap.md
    - Agent skills roadmap: agent-skills.md
    - Local triage implementation:
        - Specification: specs/001-local-triage/spec.md
        - Plan: specs/001-local-triage/plan.md
        - Tasks: specs/001-local-triage/tasks.md
    - Implementation checklist: checklist.md
    - Complete release:
        - Specification: specs/002-complete-release/spec.md
        - Plan: specs/002-complete-release/plan.md
        - Tasks: specs/002-complete-release/tasks.md
    - Architecture: architecture.md
    - API Documentation 🤖: reference/
    - Contributing 🤝: contributing.md
theme:
    favicon: assets/brand-mark.svg
    logo: assets/brand-mark.svg
    name: material
    features:
        - navigation.tracking
        - content.code.annotate
        - content.code.copy
        - navigation.indexes
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-night
              name: Switch to light mode
repo_url: https://github.com/jufty-bot/gh-maintainer
repo_name: gh-maintainer
edit_uri: blob/main/docs/
site_author: juftin
remote_branch: gh-pages
copyright: Copyright © 2026 Justin Flannery
extra:
    generator: false
exclude_docs: |
    gen_pages.py
markdown_extensions:
    - toc:
          permalink: "#"
    - pymdownx.snippets:
          base_path:
              - !relative $config_dir
    - pymdownx.magiclink
    - attr_list
    - sane_lists
    - md_in_html
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - markdown.extensions.attr_list
    - pymdownx.keys
    - pymdownx.tasklist
    - pymdownx.tilde
    - callouts
    - pymdownx.details
    - pymdownx.emoji
    - pymdownx.tabbed:
          alternate_style: true
plugins:
    - search
    - markdown-exec
    - section-index
    - autorefs
    - mkdocstrings:
          handlers:
              python:
                  inventories:
                      - https://docs.python.org/3/objects.inv
                  options:
                      docstring_style: numpy
    - gen-files:
          scripts:
              - docs/gen_pages.py
    - literate-nav:
          nav_file: SUMMARY.md
